name = "active-calendar"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Cron triggers (UTC). Los 3 "0 11/15/23" = 07:00/11:00/19:00 SDQ: sincronizan el
# iCal de todos los usuarios. El "*/30" corre cada 30 min y solo despacha los
# recordatorios por correo a la hora personalizada de cada quien (resolución 30 min).
[triggers]
crons = ["0 11 * * *", "0 15 * * *", "0 23 * * *", "*/30 * * * *"]

# Variables NO secretas (se versionan aquí). APP_BASE_URL = URL real del Worker.
# CLERK_PUBLISHABLE_KEY (pk_...) es PÚBLICA: pégala aquí (acaba incrustada en el HTML
# de todas formas). OJO: lo que pongas en [vars] sobrescribe el dashboard en cada deploy,
# así que este archivo es la fuente de verdad para estas dos variables.
[vars]
APP_BASE_URL = "https://activecalendar.site"
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuYWN0aXZlY2FsZW5kYXIuc2l0ZSQ"
# Remitente de los correos (no es secreto). El dominio debe estar verificado en Resend.
RESEND_FROM = "Active Calendar <recordatorios@activecalendar.site>"
# Usuario del bot de Telegram (público, sin @). Se usa para el enlace t.me de conexión.
TELEGRAM_BOT_USERNAME = "ActiveCalendarBot"

# Secrets (cargar en el dashboard de Cloudflare o con `wrangler secret put`):
#   CLERK_SECRET_KEY        sk_...  verifica tokens y consulta usuarios de Clerk
#   SUPABASE_URL            URL del proyecto Supabase
#   SUPABASE_SERVICE_KEY    service role key (bypass RLS; solo server-side)
#   RESEND_API_KEY          re_...  envía los correos (recordatorio semanal)
#   TELEGRAM_BOT_TOKEN      123:ABC... token del bot (de @BotFather)
#   TELEGRAM_WEBHOOK_SECRET cadena aleatoria; valida que el webhook viene de Telegram

[observability]
enabled = true
