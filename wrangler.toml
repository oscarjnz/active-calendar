name = "active-calendar"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Cron triggers en UTC equivalentes a 07:00, 11:00 y 19:00 hora Santo Domingo (UTC-4).
# El cron itera todos los usuarios con ical_url configurado y refresca sus tareas.
[triggers]
crons = ["0 11 * * *", "0 15 * * *", "0 23 * * *"]

# Variable publica (no secreta): URL del propio Worker. Se inyecta al HTML para que
# Supabase Auth sepa a donde redirigir despues del magic link.
# Sobrescribela en `wrangler.toml` o via dashboard para tu dominio real.
[vars]
APP_BASE_URL = "https://active-calendar.workers.dev"

# Secrets esperados (cargar en el dashboard de Cloudflare o con `wrangler secret put`):
#   SUPABASE_URL          URL del proyecto Supabase
#   SUPABASE_ANON_KEY     anon/public key (la usa el frontend; va incrustada en el HTML)
#   SUPABASE_SERVICE_KEY  service role key (solo server-side; bypass RLS para cron y sync)

[observability]
enabled = true
